[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerion-portfolio-manager"
version = "0.1.0"
description = "Fixture-backed agentic portfolio intelligence and simulated DCA execution"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
zpm-mcp = "zerion_portfolio_manager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
