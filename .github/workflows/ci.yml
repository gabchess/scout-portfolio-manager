name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e '.[test,quality,mcp]'
      - name: Ruff
        run: ruff check scripts tests/test_quality_gates.py demo
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Secret scan
        run: python scripts/security_scan.py .
      - name: Plugin manifest and README checks
        run: python scripts/check_plugin_manifest.py .
